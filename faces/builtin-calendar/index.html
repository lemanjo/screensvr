<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar Hours</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="clock">
        <p id="date"></p>
        <time id="time">—</time>
      </section>
      <section class="appointment" aria-label="Next appointment">
        <p id="label" class="eyebrow">A LITTLE ROOM IN THE DAY</p>
        <h1 id="title">Your time, quietly.</h1>
        <p id="when"></p>
        <p id="status"></p>
      </section>
    </main>
    <script src="/face-sdk.js"></script>
    <script src="face.js"></script>
  </body>
</html>
