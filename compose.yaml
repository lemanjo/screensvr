services:
  screensvr:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - screensvr-data:/data
      # Optional: mount a host/NAS photo directory read-only.
      # - /mnt/nas/photos/screensvr:/photos:ro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  screensvr-data:
